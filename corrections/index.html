<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corrections — Animations</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section>
    <h2>1. Transition du bouton (aller et retour)</h2>
    <button class="bouton">Survolez-moi</button>
  </section>

  <section>
    <h2>2. Sous-menu en fondu</h2>
    <div class="menu">Menu
      <ul class="sous-menu">
        <li>Option 1</li>
        <li>Option 2</li>
        <li>Option 3</li>
      </ul>
    </div>
    <div style="height:110px"></div>
  </section>

  <section>
    <h2>3. Icône : agrandir + tourner</h2>
    <span class="icone">⚙️</span>
  </section>

  <section>
    <h2>4. Carte en fondu au chargement</h2>
    <div class="carte">Je suis apparue en fondu.</div>
  </section>

  <section>
    <h2>5. Cercle de chargement</h2>
    <div class="cercle"></div>
  </section>

  <section>
    <h2>6. Aiguille (tour complet)</h2>
    <div class="aiguille"></div>
  </section>
</body>
</html>
